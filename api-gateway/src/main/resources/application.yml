server:
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Route 1: identity-service (Port 8081)
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://127.0.0.1:${IDENTITY_PORT:8081}}
          predicates:
            - Path=/api/auth/**, /api/v1/auth/**, /api/users/**, /api/v1/users/**

        # Route 2: catalog-service (Port 8082)
        # NOTE: /api/variants is deliberately NOT routed. It is the internal stock contract
        # used by order-pos-service over Feign and must stay off the public edge.
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://127.0.0.1:${CATALOG_PORT:8082}}
          predicates:
            - Path=/api/catalog/**, /api/products/**, /api/categories/**, /api/locations, /api/inventory, /api/inventory/**

        # Route 3: order-pos-service (Port 8083)
        - id: order-pos-service
          uri: ${ORDER_POS_SERVICE_URL:http://127.0.0.1:${ORDER_PORT:8083}}
          predicates:
            - Path=/api/orders/**, /api/orders, /api/pos/**, /api/cart/**, /api/payments/**, /api/vouchers/**, /api/promotions/**, /api/loyalty/**

        # Route 4: eyewear-lab-service (Port 8084)
        - id: eyewear-lab-service
          uri: ${EYEWEAR_LAB_SERVICE_URL:http://127.0.0.1:${LAB_PORT:8084}}
          predicates:
            - Path=/api/prescriptions/**, /api/lab-jobs/**, /api/lab-jobs, /api/eye-exams/**, /api/warranties/**, /api/repair-services/**, /api/appointments/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
