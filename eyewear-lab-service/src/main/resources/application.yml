server:
  port: ${LAB_PORT:8084}

services:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://127.0.0.1:${IDENTITY_PORT:8081}}
  order-pos-service:
    url: ${ORDER_POS_SERVICE_URL:http://127.0.0.1:${ORDER_PORT:8083}}
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://127.0.0.1:${CATALOG_PORT:8082}}

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: eyewear-lab-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/db_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

glassstore:
  demo:
    seed:
      enabled: ${DEMO_SEED_ENABLED:false}
