server:
  port: 8083

services:
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  eyewear-lab-service:
    url: ${EYEWEAR_LAB_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: order-pos-service
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/db_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

