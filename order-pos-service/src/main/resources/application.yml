server:
  port: ${ORDER_PORT:8083}

services:
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://127.0.0.1:${CATALOG_PORT:8082}}
  eyewear-lab-service:
    url: ${EYEWEAR_LAB_SERVICE_URL:http://127.0.0.1:${LAB_PORT:8084}}

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: order-pos-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/db_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

glassstore:
  demo:
    seed:
      enabled: ${DEMO_SEED_ENABLED:false}

payment:
  sandbox:
    enabled: ${PAYMENT_SANDBOX_ENABLED:true}
    provider: ${PAYMENT_SANDBOX_PROVIDER:VIETQR}
    secret-key: ${PAYMENT_SANDBOX_SECRET:GlassStoreSandboxSecretKey20261110!@#HMAC512}
  vietqr:
    bank-id: ${PAYMENT_VIETQR_BANK_ID:970422}
    account-no: ${PAYMENT_VIETQR_ACCOUNT_NO:0987654321}
    account-name: ${PAYMENT_VIETQR_ACCOUNT_NAME:OPTIVISION GLASS STORE}
    template: ${PAYMENT_VIETQR_TEMPLATE:compact2}
  vnpay:
    tmn-code: ${PAYMENT_VNPAY_TMN_CODE:OPTIVIS1}
    hash-secret: ${PAYMENT_VNPAY_HASH_SECRET:GlassStoreSandboxSecretKey20261110!@#HMAC512}
    url: ${PAYMENT_VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${PAYMENT_VNPAY_RETURN_URL:http://localhost:5173/payment-return}
