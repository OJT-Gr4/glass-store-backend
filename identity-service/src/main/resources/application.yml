server:
  port: ${IDENTITY_PORT:8081}

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/db_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 giờ

glassstore:
  demo:
    seed:
      enabled: ${DEMO_SEED_ENABLED:false}

sms:
  provider:
    url: ${SMS_PROVIDER_URL:sandbox}
    api-key: ${SMS_PROVIDER_API_KEY:}
    sender: ${SMS_PROVIDER_SENDER:OptiVision}

notification:
  sms:
    provider-url: ${NOTIFICATION_SMS_PROVIDER_URL:}
    api-key: ${NOTIFICATION_SMS_PROVIDER_API_KEY:}
    sender: ${NOTIFICATION_SMS_SENDER:OptiVision}
  email:
    provider-url: ${NOTIFICATION_EMAIL_PROVIDER_URL:}
    api-key: ${NOTIFICATION_EMAIL_PROVIDER_API_KEY:}
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@optivision.vn}

